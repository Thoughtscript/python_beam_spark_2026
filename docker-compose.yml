services:
  spark-master:
    build:
      context: ./spark-master
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "7077:7077"
      - "8080:8080"
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

  spark-worker:
    build:
      context: ./spark-worker
      dockerfile: Dockerfile
    platform: linux/amd64
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
      - "8100-8200:8100-8200"
    environment:
      DOCKER_MAC_CONTAINER: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"

  spark-beam:
    build:
      context: .
      dockerfile: spark-beam/Dockerfile
    platform: linux/amd64
    depends_on:
      - spark-master
      - spark-worker
    ports:
      - "8099:8099"